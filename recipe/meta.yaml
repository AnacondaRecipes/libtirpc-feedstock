{% set name = "libtirpc" %}
{% set version = "1.3.7" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  git_url: git://linux-nfs.org/~steved/libtirpc
  git_rev: libtirpc-{{ version.replace('.', '-') }}

build:
  number: 0
  skip: true # [win]

requirements:
  build:
    - {{ stdlib('c') }}
    - {{ compiler('c') }}
    - automake
    - libtool
    - make
    - pkg-config
    - gnuconfig
    # Tools that autotools looks for
    - sed
    - gawk

test:
  requires:
    - {{ compiler('c') }}
  files:
    - test.c

about:
  home: https://git.linux-nfs.org/?p=steved/libtirpc.git
  summary: Libtirpc is a Transport-Independent RPC library for Linux
  description: |
    The libtirpc package contains libraries that support programs that use the
    Remote Procedure Call (RPC) API. It replaces the RPC, but not the NIS library
    entries that used to be in glibc.
  license: BSD-3-Clause
  license_family: BSD
  license_file: COPYING
  dev_url: https://git.linux-nfs.org/?p=steved/libtirpc.git
  doc_url: https://git.linux-nfs.org/?p=steved/libtirpc.git

extra:
  recipe-maintainers:
    - cphyc
